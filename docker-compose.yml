name: laforja

x-api-env: &api-env
  DATABASE_URL: postgres://laforja:${DB_PASSWORD:?falta DB_PASSWORD}@postgres:5432/laforja
  AUTH_SECRET: ${AUTH_SECRET:?falta AUTH_SECRET}
  MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:?falta MP_ACCESS_TOKEN}
  MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?falta MP_WEBHOOK_SECRET}
  FRONTEND_URL: ${FRONTEND_URL:?falta FRONTEND_URL}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-pepeflynn22@gmail.com}
  RECONCILE_INTERVAL_HOURS: ${RECONCILE_INTERVAL_HOURS:-6}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  NEWSLETTER_FROM: ${NEWSLETTER_FROM:-}
  PORT: "4000"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laforja
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_DB: laforja
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laforja -d laforja"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    build: ./apps/api
    image: laforja-api
    command: ["bun", "run", "db:migrate"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    image: laforja-api
    restart: unless-stopped
    environment:
      <<: *api-env
      BACKUP_STATE_DIR: /backup-state
    # Solo el estado que deja el servicio backup (no los dumps): lo lee el panel admin.
    volumes:
      - backup_state:/backup-state
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks: [internal]

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?falta AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      API_URL: http://api:4000
      PUBLIC_SITE_URL: ${FRONTEND_URL:?falta FRONTEND_URL}
      # Sin UMAMI_WEBSITE_ID la web no manda pageviews (ver "Analytics" en docs/despliegue-vps.md).
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [internal]

  # Dump diario a un volumen propio + copia opcional a un bucket S3-compatible (R2, B2, …).
  # Ver ops/backup/ y "Backups" en docs/despliegue-vps.md.
  backup:
    build: ./ops/backup
    image: laforja-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: laforja
      PGPASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      PGDATABASE: laforja
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Sin esto rclone intenta crear el bucket y falla con tokens que solo tienen permiso de objetos.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
      BACKUP_STATE_DIR: /state
    volumes:
      - pg_backups:/backups
      - backup_state:/state
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Rol y base propios para Umami en el mismo Postgres: no ve las tablas de la app.
  umami-db:
    image: postgres:16-alpine
    profiles: [analytics]
    environment:
      PGHOST: postgres
      PGUSER: laforja
      PGPASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      PGDATABASE: laforja
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        test -n "$$UMAMI_DB_PASSWORD" || { echo "falta UMAMI_DB_PASSWORD"; exit 1; }
        psql -v ON_ERROR_STOP=1 -v pw="$$UMAMI_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE umami LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'umami') \gexec
        SELECT format('ALTER ROLE umami PASSWORD %L', :'pw') \gexec
        SELECT 'CREATE DATABASE umami OWNER umami'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami') \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  # Analytics de tráfico. La web le manda los pageviews por la red interna; el panel queda en
  # 127.0.0.1 del VPS (`make stats` abre el túnel SSH).
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    profiles: [analytics]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      umami-db:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3300}:3000"
    networks: [internal]

  # Único punto de entrada público: el ruteo por path (web vs api) se configura en el panel
  # del tunnel. Va en un profile para que el stack local levante sin token.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  pg_data:
  pg_backups:
  backup_state:

networks:
  internal:
