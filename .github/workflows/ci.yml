name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Los tests levantan Postgres en memoria con PGlite: no hace falta un service container.
      - run: bun test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      # astro check corre sobre Node y el language server hace require() de un módulo ESM,
      # que recién Node 22 soporta (con Node 20 tira ERR_REQUIRE_ESM).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
